name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  generation-tests:
    name: Generation invariants (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the test dependencies
        run: python -m pip install --upgrade pip copier pytest pyyaml
      - name: Run the generation suite
        run: python -m pytest tests/ -q

  render-and-validate:
    # The validator picks a yq transcode form at runtime from a capability probe,
    # so it has two execution paths and a single-flavour job only ever proves one.
    name: Render, then run the shipped gates against the render (${{ matrix.yq_flavor }} yq)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        yq_flavor: [mikefarah, kislyuk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install copier
        run: python -m pip install --upgrade pip copier
      # jq and the mikefarah yq both ship on the ubuntu-latest image; bats does not.
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      # Remove the preinstalled Go yq rather than shadowing it on PATH, so the
      # assertion below cannot pass by accident on a PATH-ordering quirk.
      - name: Install the kislyuk (Python) yq in place of the preinstalled Go one
        if: matrix.yq_flavor == 'kislyuk'
        run: |
          preinstalled="$(command -v yq || true)"
          if [ -n "$preinstalled" ]; then sudo rm -f "$preinstalled"; fi
          python -m pip install yq
      - name: Record the tool versions behind this job's claims
        run: |
          yq --version
          jq --version
          bats --version
      # Assert the branch this leg exists to exercise is the branch that will run.
      # Without this the kislyuk leg silently degrades into a second Go-yq run the
      # day an image change or a PATH order puts the wrong binary in front.
      - name: Assert the capability probe selects this leg's yq branch
        run: |
          if printf 'probe: 1\n' | yq -o=json '.' > /dev/null 2>&1; then
            selected=mikefarah
          elif printf 'probe: 1\n' | yq '.' > /dev/null 2>&1; then
            selected=kislyuk
          else
            selected=none
          fi
          echo "capability probe selected: $selected"
          if [ "$selected" != "${{ matrix.yq_flavor }}" ]; then
            echo "::error::expected the ${{ matrix.yq_flavor }} branch, probe selected $selected" >&2
            exit 1
          fi
      - name: Render the template
        # --vcs-ref HEAD is load-bearing. Copier's default ref for a git template
        # is its latest TAG, so the bare command renders the last release rather
        # than the commit under test. It only renders HEAD here because
        # actions/checkout does not fetch tags by default - setting fetch-tags or
        # fetch-depth: 0 for any unrelated reason would silently turn every gate
        # below into a re-test of the last release. Pin the ref instead of relying
        # on that.
        run: copier copy --defaults --trust --vcs-ref HEAD . /tmp/rka-render
      - name: Run the shipped validator against the render's own knowledge/
        working-directory: /tmp/rka-render
        run: bash scripts/validate-frontmatter.sh knowledge
      - name: Run the shipped BATS suite
        run: bats /tmp/rka-render/tests/validate-frontmatter.bats

  self-governance:
    name: This repository obeys the standard it ships
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install copier
        run: python -m pip install --upgrade pip copier
      - name: Render the template
        # --vcs-ref HEAD is load-bearing. Copier's default ref for a git template
        # is its latest TAG, so the bare command renders the last release rather
        # than the commit under test. It only renders HEAD here because
        # actions/checkout does not fetch tags by default - setting fetch-tags or
        # fetch-depth: 0 for any unrelated reason would silently turn every gate
        # below into a re-test of the last release. Pin the ref instead of relying
        # on that.
        run: copier copy --defaults --trust --vcs-ref HEAD . /tmp/rka-render
      # The SHIPPED validator, not a copy of it: a schema change that breaks this
      # repository's own knowledge/ must fail here rather than in a consumer's gate.
      - name: Validate this repository's own knowledge/
        run: bash /tmp/rka-render/scripts/validate-frontmatter.sh knowledge
      - name: Reject em dashes in markdown
        run: |
          if grep -rPn '\x{2014}' --include='*.md' .; then
            echo "::error::em dash (U+2014) found; use a plain dash instead" >&2
            exit 1
          fi
